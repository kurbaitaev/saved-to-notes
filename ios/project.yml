name: SavedToNotes
options:
  bundleIdPrefix: com.kurbaitaev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: A58FFUY6DF          # Gameplan Labs, Inc.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    PROVISIONING_PROFILE_SPECIFIER: SavedToNotes App Store
targets:
  SavedToNotes:
    type: application
    platform: iOS
    sources:
      - path: SavedToNotes/Sources
      - path: SavedToNotes/Resources
    info:
      path: SavedToNotes/Info.plist
      properties:
        CFBundleDisplayName: Saved
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurbaitaev.savedtonotes
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Saved
        # xcodegen defaults the target to 'iPhone Developer', which beats the
        # project-level value. TestFlight needs the distribution identity.
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: SavedToNotes App Store
