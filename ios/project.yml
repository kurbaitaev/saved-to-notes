name: SavedToNotes
options:
  bundleIdPrefix: com.kurbaitaev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: A58FFUY6DF          # Gameplan Labs, Inc.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Distribution
    PROVISIONING_PROFILE_SPECIFIER: SavedToNotes App Store
targets:
  SavedToNotes:
    type: application
    platform: iOS
    sources:
      - path: SavedToNotes/Sources
      - path: SavedToNotes/Resources
    dependencies:
      - target: ShareExtension
    info:
      path: SavedToNotes/Info.plist
      properties:
        CFBundleDisplayName: Afterscroll
        # Point at the build settings instead of hardcoding. xcodegen otherwise
        # writes a literal "1" here, which silently ignored the build number
        # release.sh passes — so the second upload would collide with the first.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Shows where you are next to the places you saved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurbaitaev.savedtonotes
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Afterscroll
        # xcodegen defaults the target to 'iPhone Developer', which beats the
        # project-level value. TestFlight needs the distribution identity.
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: SavedToNotes App Store

  # "Afterscroll" in the share sheet: sends the shared link to the server.
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: SavedToNotes/Sources/Secrets.swift
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Afterscroll
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurbaitaev.savedtonotes.share
        MARKETING_VERSION: "1.9"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: Apple Distribution
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: Afterscroll Share App Store
